<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MotoRoutes Web</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.css" type="text/css">
    
    <!-- Fuentes (System fallback para privacidad/rendimiento) -->
    <!-- SPA Routing Hack for GitHub Pages -->
    <script type="text/javascript">
        (function(l) {
            if (l.search[1] === 'p') {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&') 
                }).filter(function(s) { 
                    return s.slice(0, 2) === 'p=' 
                })[0].slice(2);
                if (decoded !== l.pathname.slice(1)) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, l.pathname.lastIndexOf('/') + 1) + decoded + (l.hash || '')
                    );
                }
            }
        }(window.location))
    </script>
</head>
<body>
    <div id="app">
        <!-- Moto HUD (Navegación) -->
        <div id="moto-hud" class="hud-overlay">
            <div class="hud-top">
                <div id="hud-instruction" class="hud-main-instruction">Calculando...</div>
                <div id="hud-next-dist" class="hud-sub-instruction">-- m</div>
            </div>
            <div class="hud-middle"></div>
            <div class="hud-bottom">
                <div class="hud-stat">
                    <span id="hud-speed" class="hud-value">0</span>
                    <span class="hud-unit">km/h</span>
                </div>
                <div class="hud-stat">
                    <span id="hud-limit" class="hud-value-small">90</span>
                    <span class="hud-label">Límite</span>
                </div>
                <div class="hud-stat">
                    <span id="hud-eta" class="hud-value-small">--:--</span>
                    <span class="hud-label">Llegada</span>
                </div>
            </div>
            <button id="btn-exit-nav" class="hud-exit-btn">SALIR</button>
        </div>

        <header id="main-header">
            <div class="header-content">
                <h1>MotoRoutes <span class="badge">PRO</span></h1>
                <div id="sync-status" class="status-indicator" title="Sincronizado"></div>
            </div>
        </header>

        <!-- Panel de Planificación estilo Calimoto -->
        <aside id="planner-panel" class="planner-sidebar">
            <div class="planner-tabs">
                <button class="tab-btn active" data-tab="plan">Planear</button>
                <button class="tab-btn" data-tab="catalog">Catálogo</button>
            </div>

            <div id="plan-tab" class="tab-content active">
                <div class="plan-options">
                    <button id="btn-round-trip" class="option-card">
                        <span class="icon">🔄</span>
                        <div class="text">
                            <strong>Ruta Circular</strong>
                            <span>Genera un bucle desde aquí</span>
                        </div>
                    </button>
                    <button id="btn-twisty-mode" class="option-card">
                        <span class="icon">🛣️</span>
                        <div class="text">
                            <strong>Carreteras con Curvas</strong>
                            <span>Evitar autovías</span>
                        </div>
                    </button>
                </div>

                <div class="search-section">
                    <div id="directions-container"></div>
                </div>
            </div>

            <div id="catalog-tab" class="tab-content">
                <div id="routes-list" class="compact-list">
                    <p class="empty-msg">Cargando rutas...</p>
                </div>
            </div>
        </aside>

        <main id="map-container" class="app-view active">
            <div id="map"></div>
            <button id="btn-recenter" class="map-recenter-btn">📍</button>
            
            <button id="btn-start-nav" class="start-nav-btn" style="display: none;">
                🚀 INICIAR RUTA
            </button>
        </main>

        <!-- Vista de Rutas (Fallback / Full list) -->
        <section id="view-routes" class="app-view">
            <header class="view-header">
                <h2>Mis Rutas</h2>
            </header>
            <div id="routes-list-full" class="content-list">
                <p class="empty-msg">Cargando rutas...</p>
            </div>
        </section>

        <!-- Vista de POIs -->
        <section id="view-pois" class="app-view">
            <header class="view-header">
                <h2>Puntos de Interés</h2>
            </header>
            <div id="pois-list" class="content-list">
                <p class="empty-msg">Cargando POIs...</p>
            </div>
        </section>

        <div id="toast-container" aria-live="polite"></div>

        <nav class="bottom-nav">
            <button id="btn-home" class="nav-item active">
                <span class="icon">🏠</span>
                <span>Explorar</span>
            </button>
            <button id="btn-routes-toggle" class="nav-item">
                <span class="icon">🏍️</span>
                <span>Planear</span>
            </button>
            <button id="btn-pois" class="nav-item">
                <span class="icon">📍</span>
                <span>POIs</span>
            </button>
            <button id="btn-add" class="nav-item action-btn">
                <span class="icon">+</span>
            </button>
        </nav>

        <!-- Modal de Acciones -->
        <section id="modal-add" class="modal">
            <div class="modal-content">
                <h2>Nueva Entrada</h2>
                <button id="btn-import-gpx" class="primary-btn">Importar GPX</button>
                <button id="btn-manual-route" class="secondary-btn">Dibujar Ruta</button>
                <button id="btn-add-poi" class="secondary-btn">Añadir POI</button>
                <button class="close-modal">Cancelar</button>
            </div>
        </section>
    </div>

    <!-- Librerías Externas -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@0.16.0/dist/togeojson.umd.min.js"></script>

    <!-- App Logic -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
