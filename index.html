<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MotoRoutes Web</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    
    <!-- Fuentes (System fallback para privacidad/rendimiento) -->
    <!-- SPA Routing Hack for GitHub Pages -->
    <script type="text/javascript">
        (function(l) {
            if (l.search[1] === 'p') {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&') 
                }).filter(function(s) { 
                    return s.slice(0, 2) === 'p=' 
                })[0].slice(2);
                if (decoded !== l.pathname.slice(1)) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, l.pathname.lastIndexOf('/') + 1) + decoded + (l.hash || '')
                    );
                }
            }
        }(window.location))
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>MotoRoutes</h1>
            <div id="sync-status" class="status-indicator" title="Sincronizado"></div>
        </header>

        <main id="map-container" role="main">
            <div id="map"></div>
        </main>

        <div id="toast-container" aria-live="polite"></div>

        <nav class="bottom-nav" role="navigation">
            <button id="btn-home" class="nav-item active" aria-label="Inicio">
                <span class="icon" aria-hidden="true">🏠</span>
                <span>Inicio</span>
            </button>
            <button id="btn-routes" class="nav-item" aria-label="Mis Rutas">
                <span class="icon" aria-hidden="true">🏍️</span>
                <span>Rutas</span>
            </button>
            <button id="btn-pois" class="nav-item" aria-label="Puntos de Interés">
                <span class="icon" aria-hidden="true">📍</span>
                <span>POIs</span>
            </button>
            <button id="btn-add" class="nav-item action-btn" aria-label="Añadir nueva ruta">
                <span class="icon" aria-hidden="true">+</span>
            </button>
        </nav>

        <!-- Modales -->
        <section id="modal-add" class="modal" aria-modal="true" role="dialog" aria-labelledby="modal-title">
            <div class="modal-content">
                <h2 id="modal-title">Nueva Ruta</h2>
                <button id="btn-import-gpx" class="primary-btn">Importar GPX</button>
                <button id="btn-manual-route" class="secondary-btn">Dibujar en Mapa</button>
                <button class="close-modal" aria-label="Cerrar modal">Cancelar</button>
            </div>
        </section>
    </div>

    <!-- Librerías Externas -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@0.16.0/dist/togeojson.umd.min.js"></script>

    <!-- App Logic -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
