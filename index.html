<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MotoRoutes Web</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.css" type="text/css">
    
    <!-- Fuentes (System fallback para privacidad/rendimiento) -->
    <!-- SPA Routing Hack for GitHub Pages -->
    <script type="text/javascript">
        (function(l) {
            if (l.search[1] === 'p') {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&') 
                }).filter(function(s) { 
                    return s.slice(0, 2) === 'p=' 
                })[0].slice(2);
                if (decoded !== l.pathname.slice(1)) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, l.pathname.lastIndexOf('/') + 1) + decoded + (l.hash || '')
                    );
                }
            }
        }(window.location))
    </script>
</head>
<body>
    <div id="app">
        <!-- Moto HUD (Navegación / Modo Garmin) -->
        <div id="moto-hud" class="hud-overlay">
            <div class="hud-nav-bar">
                <div class="hud-direction">
                    <span id="hud-turn-icon" class="turn-icon">⬆</span>
                    <div class="hud-instruction-group">
                        <span id="hud-next-dist" class="dist-value">-- m</span>
                        <span id="hud-instruction" class="street-name">Calculando ruta...</span>
                    </div>
                </div>
                <div class="hud-meta">
                    <div class="meta-item">
                        <span class="label">LLEGADA</span>
                        <span id="hud-eta" class="value">--:--</span>
                    </div>
                </div>
                <button id="btn-exit-nav" class="hud-exit-btn">SALIR</button>
            </div>
            
            <div class="hud-telemetry">
                <div class="speed-box">
                    <span id="hud-speed">0</span>
                    <span class="unit">km/h</span>
                </div>
            </div>
        </div>

        <header id="main-header">
            <div class="header-content">
                <h1>MotoRoute <span class="badge">PRO</span></h1>
                <div class="header-actions">
                    <div id="sync-status" class="status-indicator" title="Sincronizado"></div>
                </div>
            </div>
        </header>

        <!-- Controles Flotantes -->
        <div class="map-controls">
            <button id="btn-recenter" class="fab-btn" title="Centrar">📍</button>
            <button id="btn-compass" class="fab-btn" title="Norte">🧭</button>
        </div>

        <!-- Panel de Planificación -->
        <aside id="planner-panel" class="planner-sidebar">
            <div class="planner-header">
                <h2>Buscar Destino</h2>
                <button class="close-sidebar">✕</button>
            </div>
            <div class="planner-location-quick">
                <button id="btn-use-mylocation" class="secondary-btn small-btn">
                    📍 USAR MI UBICACIÓN
                </button>
                <button id="btn-add-stop" class="secondary-btn small-btn" title="Añadir parada">
                    ➕ PARADA
                </button>
                <button id="btn-start-nav-sidebar" class="primary-btn" style="display: none; width: 100%; margin-top: 0.5rem;">
                    🏁 EMPEZAR NAVEGACIÓN
                </button>
            </div>
            <div id="directions-container"></div>

            <div id="routes-list" class="compact-list"></div>
        </aside>

        <main id="map-container" class="app-view active">
            <div id="map"></div>
        </main>

        <!-- Vistas Secundarias -->
        <section id="view-settings" class="app-view">
            <header class="view-header">
                <button class="back-btn">⬅</button>
                <h2>Ajustes</h2>
                <div class="header-spacer"></div>
            </header>
            <div class="settings-content">
                <div class="setting-item">
                    <span>Modo Claro / Oscuro</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-theme" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <span>Unidades</span>
                    <span>Métrico (km)</span>
                </div>
                <div class="setting-item">
                    <span>Icono de Posición</span>
                    <div class="vehicle-selector" id="vehicle-selector">
                        <div class="vehicle-option active" data-vehicle="moto">MOTO</div>
                        <div class="vehicle-option" data-vehicle="car">COCHE</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Barra Inferior GPS Style -->
        <nav class="gps-nav-bar">
            <button id="btn-map" class="gps-nav-item active">
                <span class="icon">🏠</span>
                <span>Mapa</span>
            </button>
            <button id="btn-search" class="gps-nav-item">
                <span class="icon">🔍</span>
                <span>Buscar</span>
            </button>
            <button id="btn-go" class="gps-nav-item action-highlight">
                <span class="icon">🏁</span>
                <span>Ir</span>
            </button>
            <button id="btn-settings" class="gps-nav-item">
                <span class="icon">⚙️</span>
                <span>Ajustes</span>
            </button>
        </nav>

        <!-- Modal de Acciones -->
        <section id="modal-add" class="modal">
            <div class="modal-content">
                <h2>Nueva Entrada</h2>
                <button id="btn-import-gpx" class="primary-btn">Importar GPX</button>
                <button id="btn-manual-route" class="secondary-btn">Dibujar Ruta</button>
                <button id="btn-add-poi" class="secondary-btn">Añadir POI</button>
                <button class="close-modal">Cancelar</button>
            </div>
        </section>
    </div>

    <!-- Librerías Externas -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@0.16.0/dist/togeojson.umd.min.js"></script>

    <!-- App Logic -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
