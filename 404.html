<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MotoRoutes SPA Redirect</title>
    <script type="text/javascript">
        // Single Page Apps para GitHub Pages
        // Mitiga el problema de que GitHub Pages no soporta routing SPA (devuelve 404)
        // Este script guarda la ruta actual y redirige a index.html
        var pathSegmentsToKeep = 0;

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
